services:
  flexpm:
    build: .
    container_name: flexpm
    expose:
      - "3210"
    ports:
      - "3210:3210"  # Keep direct access for development
    volumes:
      - flexpm-data:/data
    environment:
      - FLEXPM_HOST=0.0.0.0
      - FLEXPM_PORT=3210
      - FLEXPM_DATABASE_URL=sqlite:/data/flexpm.db?mode=rwc
      - FLEXPM_STORAGE_DIR=/data/storage
      - FLEXPM_LOG_LEVEL=info
      # - FLEXPM_LOG_JSON=true    # Uncomment for structured JSON logs
    restart: unless-stopped
    networks:
      - flexpm-network
    healthcheck:
      test: ["CMD-SHELL", "flexpm-cli --help > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: flexpm-frontend
    expose:
      - "80"
    ports:
      - "8080:80"  # Access frontend directly at http://localhost:8080
    restart: unless-stopped
    networks:
      - flexpm-network
    depends_on:
      flexpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: flexpm-caddy
    ports:
      - "9000:9000"    # HTTP on port 9000 (multi-app friendly)
      - "9443:9443"    # HTTPS on port 9443 (multi-app friendly)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - flexpm-network
    depends_on:
      flexpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  flexpm-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  flexpm-network:
    driver: bridge
