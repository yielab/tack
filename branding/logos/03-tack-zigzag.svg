<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g03" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#f5f3ff"/>
  <!-- "Tacking" path: a sailboat's zigzag course upwind = changing direction toward a goal -->
  <path d="M14 50 L28 36 L22 30 L40 14"
        fill="none" stroke="url(#g03)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead at the goal -->
  <path d="M40 14 l-9 1 M40 14 l1 9" fill="none" stroke="url(#g03)" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- node dots marking each tack -->
  <circle cx="14" cy="50" r="3.5" fill="#6d28d9"/>
  <circle cx="28" cy="36" r="3.5" fill="#7c3aed"/>
  <circle cx="22" cy="30" r="3.5" fill="#7c3aed"/>
</svg>
