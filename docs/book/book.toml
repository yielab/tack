[book]
title = "Tack Documentation"
authors = ["Santiago Yie"]
description = "The User, Administrator and Developer Guides and the roadmap for Tack"
src = "src"
language = "en"

[rust]
edition = "2021"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/yielab/tack"
edit-url-template = "https://github.com/yielab/tack/edit/develop/docs/book/src/{path}"
no-section-label = false

# Pages that moved when the book was split into three guides keep their old addresses.
[output.html.redirect]
"/user-guide/agent-runners.html" = "running-agents.html"
