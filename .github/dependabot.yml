version: 2

# Noise policy (solo maintainer): every ecosystem is grouped, so a run opens at most
# ONE minor/patch PR and ONE major PR per ecosystem instead of one per dependency.
# Majors are grouped separately on purpose — a breaking major must never block the
# routine patch roll-up behind it. Security advisories ignore `schedule` and still
# arrive immediately, so a slower cadence does not delay security fixes.
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: "/"
    # Target the integration branch, not whatever the default branch happens
    # to be — auto-merge must go through the same line every card does, never
    # land directly on `main` behind its back (see the dtolnay/rust-toolchain
    # incident below for what happens when it doesn't).
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  # Frontend npm packages
  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # GitHub Actions — these move slowly and are almost always safe to take in bulk.
  # Previously ungrouped, which is why five of eight open PRs were single action bumps.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # dtolnay/rust-toolchain's "version" isn't an action release — it's the
      # Rust channel/version each job's `uses:` line selects (@stable,
      # @1.85.0 for the MSRV floor). Dependabot bumped the MSRV job's pin to
      # @1.100.0 as a routine "minor" action bump and auto-merged it,
      # silently defeating that job's entire purpose (testing the documented
      # floor in Cargo.toml/README/CONTRIBUTING, not the latest). This pin
      # only ever changes as a deliberate, coordinated decision — never
      # automated.
      - dependency-name: "dtolnay/rust-toolchain"
