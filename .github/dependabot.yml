version: 2

# Noise policy (solo maintainer): every ecosystem is grouped, so a run opens at most
# ONE minor/patch PR and ONE major PR per ecosystem instead of one per dependency.
# Majors are grouped separately on purpose — a breaking major must never block the
# routine patch roll-up behind it. Security advisories ignore `schedule` and still
# arrive immediately, so a slower cadence does not delay security fixes.
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  # Frontend npm packages
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # GitHub Actions — these move slowly and are almost always safe to take in bulk.
  # Previously ungrouped, which is why five of eight open PRs were single action bumps.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
