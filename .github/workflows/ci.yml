name: CI

on:
  push:
    branches: ["main", "develop", "claude/**"]
  pull_request:

# Read-only by default; no job here needs to write anything.
permissions:
  contents: read

# One run per branch/PR at a time — a fixup push cancels the run it superseded
# instead of both running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every multi-line shell step in this workflow runs under `bash` with
# `set -euo pipefail` as its first line (see each `run: |` block) so a failing
# command in the middle of a pipeline — e.g. `git diff --exit-code docs/openapi.json`
# piped through something, or a `cargo test` piped to a filter — cannot be masked
# by the exit status of the last command in the pipe.
defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Every gate below runs with `if: success() || failure()` (not the
      # default "stop at the first red step"): each is logically independent
      # of the others, so a maintainer pushing once should see every gate's
      # real status rather than have seven of them report "never ran" behind
      # whichever one failed first. The job's own conclusion still turns red
      # if any step here fails — this only removes the early exit, not the
      # gate.
      #
      # Regenerate the committed OpenAPI contract from the code and fail if it
      # drifted. A handler/DTO change without a spec regen (UPDATE_OPENAPI=1
      # cargo test -p tack-api --test openapi_contract) is caught here.
      - name: OpenAPI contract drift gate
        if: success() || failure()
        run: |
          set -euo pipefail
          UPDATE_OPENAPI=1 cargo test -p tack-api --test openapi_contract openapi_spec_matches_committed_file
          git diff --exit-code docs/openapi.json
      # Regenerate the tack-orch regression oracles (docs/plans/agnostic-control-plane.md
      # §6) from the code and fail if they drifted. docket_tick_contract_test is the
      # primary oracle (one full reconciler tick's ordered request list plus the
      # resulting orch_runs/orch_approvals/orch_events/orch_metrics/orch_trace_cursors
      # rows); docket_wire_contract_test is the secondary, per-method oracle. A trait or
      # reconciler rewrite that changes what leaves the process, or what gets persisted,
      # without a golden regen is caught here.
      - name: tack-orch golden drift gate
        if: success() || failure()
        run: |
          set -euo pipefail
          UPDATE_GOLDEN=1 cargo test -p tack-orch --test docket_tick_contract_test
          UPDATE_GOLDEN=1 cargo test -p tack-orch --test docket_wire_contract_test
          git diff --exit-code crates/tack-orch/tests/golden/
      # The runner-v1 fixtures under docs/contracts/runner-v1/ are the language-neutral
      # authority (III.1.6); this test byte-pins every one of them and is committed to
      # git, not generated at job time (`git ls-files docs/contracts/runner-v1` — 47
      # tracked files). A deliberate mutation of a fixture and revert is exercised
      # locally (see III-G4 handoff) rather than in this workflow, so CI never carries a
      # step designed to fail.
      - name: Runner-v1 fixture drift gate (byte-pinned contract)
        if: success() || failure()
        run: cargo test -p tack-orch --test runner_contract
      # Wave-2 gate: full runner lifecycle proven through the real production router,
      # not card-local scaffolding.
      - name: Runner lifecycle gate (real router)
        if: success() || failure()
        run: cargo test -p tack-api --test wave2_gate
      # Fake-binary harness adapters (crates/tack-runner/src/harness/fixtures) and the
      # runner crash matrix — spawn/ack/completion/cancellation loss and ambiguous
      # recovery, each proven to never blind-retry. Never uses a live harness binary.
      - name: Runner fake-adapter and crash-matrix tests
        if: success() || failure()
        run: cargo test -p tack-runner
      # Deterministic recovery from a migration failure mid-run — the runner executes
      # each ALTER individually with no wrapping transaction (CLAUDE.md), so a partial
      # apply must leave the DB in a state the next startup can repair, not brick it.
      - name: Migration crash-recovery test
        if: success() || failure()
        run: cargo test -p tack-db --test orch_migrations_test
      # Security/chaos subset: auth-surface separation (operator vs runner-protocol
      # tokens cannot substitute for each other), CORS allow-list enforcement, and
      # concurrent-write race safety (WIP limit, board drag) proven
      # against a real, contended DB rather than a sequential retry loop.
      - name: Security/chaos subset
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo test -p tack-api --test trust_boundary_test
          cargo test -p tack-api --test cors_test
          cargo test -p tack-api --test board_drag_wip_race_test
          cargo test -p tack-api --test wip_limit_race_test
          cargo test -p tack-api --test runner_vertical_slice
      # Contention-sensitive: forced to a single test thread, matching
      # docs/agent-handoffs/part-iii/III-F6.md's isolated-run instruction.
      - name: Scheduler E2E gate (isolated)
        if: success() || failure()
        run: cargo test -p tack-cli --test e6_scheduler_e2e_test -- --test-threads=1

  msrv:
    name: MSRV (Rust 1.89 — dependency floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Edition 2024 sets a 1.85 language floor, but the dependency graph sets a
      # higher one: object_store -> crc-fast needs 1.89, tracing-appender -> time
      # needs 1.88, and the idna/icu stack needs 1.86. The pin is the real floor,
      # not the language's. Bump policy: the MSRV may be raised in a minor release
      # when a dependency or language feature requires it; update this pin, the
      # README/CONTRIBUTING badges, and `rust-version` in Cargo.toml together.
      # Verify with `cargo +<pin> build --workspace --locked` before changing it.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: msrv
      # `rust-toolchain.toml` pins `channel = "stable"`, and rustup ranks a
      # toolchain file ABOVE the default that the action sets with `rustup
      # default`. Without an explicit RUSTUP_TOOLCHAIN — which outranks the
      # file — this step builds on stable and the pin above decides nothing.
      - name: Build on MSRV
        run: cargo build --workspace --locked
        env:
          RUSTUP_TOOLCHAIN: 1.89.0

  desktop:
    name: Desktop app (tack-desktop workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # tack-desktop is deliberately NOT a member of the root workspace: Tauri
      # drags GTK, WebKit and glib into whatever workspace contains it, and the
      # server has to keep building on a machine that has none of them. The
      # cost of that separation is that no other job compiles this crate, so
      # this one exists to.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: crates/tack-desktop
      # `dependency_boundary.rs` reads the ROOT workspace's tree with --offline
      # to prove tack-cli never links a webview. Offline needs the registry
      # cache populated, which nothing else in this job would do.
      - name: Warm the root registry cache
        run: cargo fetch --locked
      - name: Check formatting
        working-directory: crates/tack-desktop
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: crates/tack-desktop
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: crates/tack-desktop
        run: cargo test

  coverage:
    name: Coverage (llvm-cov + Vitest thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-llvm-cov
      # Per-crate line-coverage floors mirror the targets documented in
      # docs/TESTING.md (tack-core >= 85%, tack-db/tack-api/tack-orch >= 70%).
      - name: Rust coverage — tack-core (>= 85%)
        run: cargo llvm-cov -p tack-core --fail-under-lines 85
      - name: Rust coverage — tack-db (>= 70%)
        run: cargo llvm-cov -p tack-db --fail-under-lines 70
      - name: Rust coverage — tack-api (>= 70%)
        run: cargo llvm-cov -p tack-api --fail-under-lines 70
      # tack-orch had no floor before Phase 39 (docs/plans/agnostic-control-plane.md
      # item 0.4) — it is the adapter code this cycle rewrites the most, and was the
      # least-guarded crate in the workspace without this line.
      - name: Rust coverage — tack-orch (>= 70%)
        run: cargo llvm-cov -p tack-orch --fail-under-lines 70
      # tack-runner had no floor before III-G4 (Wave 6) — it owns local credentials,
      # the journal and the harness subprocess boundary. Measured locally at 93.66%
      # line coverage (`cargo llvm-cov -p tack-runner --summary-only`, III-G4 handoff)
      # via fake-adapter/crash-matrix tests only; live-harness tests are `--ignored`
      # and excluded from this run by default, so the floor never depends on a billed
      # live call. 85% mirrors tack-core's floor with headroom below the measured value.
      - name: Rust coverage — tack-runner (>= 85%)
        run: cargo llvm-cov -p tack-runner --fail-under-lines 85
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps + coverage provider
        working-directory: frontend
        # --no-save keeps package.json untouched; the provider is CI-only.
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save @vitest/coverage-v8@^4
      - name: Frontend Vitest coverage thresholds
        working-directory: frontend
        run: >-
          npx vitest run --coverage
          --coverage.provider=v8
          --coverage.thresholds.lines=70
          --coverage.thresholds.functions=70
          --coverage.thresholds.statements=70
          --coverage.thresholds.branches=60

  deny:
    name: cargo-deny (licenses + duplicate deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: deny
      - name: Install cargo-deny
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-deny
      # Generated at run time (not committed) by scripts/gen-deny-toml.sh —
      # the same script `make deny` calls, so the local and CI policy can
      # never drift apart. Advisories are covered by the `security` job's
      # cargo-audit, so this run checks licenses + bans only.
      - name: Generate deny policy
        run: ./scripts/gen-deny-toml.sh
      - name: cargo deny check
        run: cargo deny check licenses bans

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: OpenAPI TS types drift gate
        # Regenerate the typed API schema from the committed spec and fail if the
        # checked-in schema.gen.ts is stale. Together with the Rust "OpenAPI
        # contract drift gate", this makes the spec → server → frontend chain
        # impossible to silently diverge.
        run: |
          set -euo pipefail
          npm run gen:api
          git diff --exit-code src/shared/api/schema.gen.ts
      - name: Type check
        run: npm run type-check
      - name: Design token gate (no new raw color literals)
        run: npm run lint:tokens
      - name: Build
        run: npm run build
      - name: Bundle size gate (entry bundle < 30 KB gzipped)
        # Routes are now lazy-loaded; only the entry (solid-js runtime) and
        # router chunks are always downloaded.  Check those stay under 30 KB.
        run: |
          set -euo pipefail
          TOTAL=0
          for f in dist/assets/index-*.js dist/assets/routing-*.js; do
            [ -f "$f" ] && TOTAL=$((TOTAL + $(gzip -c "$f" | wc -c)))
          done
          echo "Entry bundle gzipped: $TOTAL bytes (limit 30720 = 30 KB)"
          if [ "$TOTAL" -gt 30720 ]; then
            echo "ERROR: entry bundle exceeds 30 KB gzip limit"
            exit 1
          fi
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  docs:
    name: Docs (mdBook build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.4.40
      - name: Build docs
        run: mdbook build docs/book
      - name: Check for broken links
        run: |
          set -euo pipefail
          mdbook build docs/book 2>&1 | grep -i "error\|broken" && exit 1 || true

  embed-spa:
    name: Embed SPA (single-binary packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Download frontend dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Clippy with embed-spa
        run: cargo clippy -p tack-cli --features embed-spa -- -D warnings
      - name: Test with embed-spa
        run: cargo test -p tack-api --features embed-spa
      - name: Build single binary
        run: cargo build -p tack-cli --release --features embed-spa
      - name: Build tack-runner binary
        run: cargo build -p tack-runner --release
      # Budgets are measured, not copied from stale documentation: CLAUDE.md's "~10 MB"
      # figure for `tack` predates Part III's runner/orchestration dependencies
      # (reqwest+rustls, object_store/S3, tokio-tungstenite, …) — a real `cargo build
      # --release --features embed-spa` on this branch produced an 18.34 MB `tack` and a
      # 1.81 MB `tack-runner` (III-G4 handoff). Budgets below add ~35-40% headroom over
      # those measurements so the gate catches an accidental dependency that defeats
      # `opt-level = "z"` / lto / strip, not routine drift — and a doc-correction request
      # for CLAUDE.md's stale figure is recorded in the III-G4 handoff.
      - name: Binary-size budget
        run: |
          set -euo pipefail
          TACK_SIZE=$(stat -c%s target/release/tack)
          RUNNER_SIZE=$(stat -c%s target/release/tack-runner)
          TACK_MB=$(echo "scale=1; $TACK_SIZE / 1048576" | bc)
          RUNNER_MB=$(echo "scale=1; $RUNNER_SIZE / 1048576" | bc)
          echo "tack binary:        $TACK_SIZE bytes (${TACK_MB} MB), budget 26214400 (25 MB)"
          echo "tack-runner binary: $RUNNER_SIZE bytes (${RUNNER_MB} MB), budget 5242880 (5 MB)"
          FAIL=0
          if [ "$TACK_SIZE" -gt 26214400 ]; then
            echo "ERROR: tack binary exceeds the 25 MB budget"
            FAIL=1
          fi
          if [ "$RUNNER_SIZE" -gt 5242880 ]; then
            echo "ERROR: tack-runner binary exceeds the 5 MB budget"
            FAIL=1
          fi
          exit $FAIL

  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit
      - name: Rust dependency audit (honors .cargo/audit.toml)
        run: cargo audit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: npm dependency audit (fail on high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright, cross-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Pre-build server (warms the cache the Playwright webServer reuses)
        run: cargo build -p tack-cli
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
