name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Bundle size gate (entry bundle < 30 KB gzipped)
        # Routes are now lazy-loaded; only the entry (solid-js runtime) and
        # router chunks are always downloaded.  Check those stay under 30 KB.
        run: |
          TOTAL=0
          for f in dist/assets/index-*.js dist/assets/routing-*.js; do
            [ -f "$f" ] && TOTAL=$((TOTAL + $(gzip -c "$f" | wc -c)))
          done
          echo "Entry bundle gzipped: $TOTAL bytes (limit 30720 = 30 KB)"
          if [ "$TOTAL" -gt 30720 ]; then
            echo "ERROR: entry bundle exceeds 30 KB gzip limit"
            exit 1
          fi
