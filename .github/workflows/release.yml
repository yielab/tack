name: Release

# Builds single-binary distributions (server with embedded SPA + CLI) for
# Linux, macOS (Intel + Apple Silicon), and Windows, then attaches them to a
# GitHub Release. Triggered by pushing a version tag:
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify versions match
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $CARGO_VERSION — tag: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match workspace version $CARGO_VERSION"
            exit 1
          fi

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.platform }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p tack-api -p tack-cli --features tack-api/embed-spa

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          STAGE="tack-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/tack-api" "$STAGE/"
          cp "target/${{ matrix.target }}/release/tack" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          cat > "$STAGE/QUICKSTART.txt" <<'EOF'
          Tack — Quick Start
          ====================

          1. Run the server:        ./tack-api
          2. Open your browser at:  http://localhost:3210
          3. Stop with Ctrl+C.

          Your data is stored in tack.db (and ./storage for attachments)
          in the directory where you run the server. Keep those files to
          keep your projects.

          The "tack" binary is an optional command-line client.
          Run "./tack --help" while the server is running.
          EOF
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "tack-$env:GITHUB_REF_NAME-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tack-api.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/tack.exe" $stage
          Copy-Item LICENSE, README.md $stage
          @"
          Tack — Quick Start
          ====================

          1. Double-click tack-api.exe (a console window opens).
          2. Open your browser at:  http://localhost:3210
          3. Close the console window to stop the server.

          If Windows SmartScreen warns about an unrecognized app, click
          "More info" then "Run anyway".

          Your data is stored in tack.db (and the storage folder for
          attachments) next to the .exe. Keep those files to keep your
          projects.

          tack.exe is an optional command-line client.
          Run "tack.exe --help" while the server is running.
          "@ | Set-Content "$stage/QUICKSTART.txt"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags with a pre-release suffix (v0.1.0-beta.1) are marked as
          # GitHub pre-releases and excluded from /releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
