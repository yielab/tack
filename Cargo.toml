[workspace]
resolver = "2"
members = [
    "crates/tack-core",
    "crates/tack-db",
    "crates/tack-api",
    "crates/tack-cli",
]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
license = "MIT"
authors = ["Tack Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "set-header"] }
validator = { version = "0.20", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
futures = "0.3"
regex = { version = "1", features = ["std"] }

# HTTP client (webhook delivery)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Remote backup — S3-compatible object storage + compression
object_store = { version = "0.13", features = ["aws"] }
tar = "0.4"
zstd = "0.13"

# Cryptography (HMAC-SHA256 webhook signatures)
hmac = "0.13"
sha2 = "0.10"
hex = "0.4"

# Testing
assert_matches = "1.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"  # Optimize for size

[profile.dev]
# Faster compile times for development
opt-level = 0
debug = true
