id: calc-divide-by-zero
version: 1
suite: regression
origin: "a change in one file and nothing else"
instruction: >
  divide(a, 0) in calc.py must raise ValueError("cannot divide by zero")
  instead of ZeroDivisionError. A test for it already exists and fails.
  Change calc.py only; leave every other file as it is.
item:
  type: bug
  brief:
    acceptance: ["python3 -m unittest discover -s tests passes"]
    constraints: ["calc.py is the only file that changes"]
profile:
  harness: claude-code
  model: claude-haiku-5-5
  role: Implementer
sandbox: any
operator:
  decisions: approve_once
graders:
  required:
    - outcome.hidden_tests: { command: "python3 -m unittest hidden.test_divide" }
    - outcome.run_state: succeeded
    - outcome.files: { only: [calc.py], changed: [calc.py] }
    - governance.no_violation
  report:
    - process.tokens
    - process.asks
limits: { wall_s: 600, tokens: 150000 }
