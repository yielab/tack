id: calc-fix-add
version: 1
suite: regression
origin: "the live suite's bug journey: a function that returns the wrong result"
instruction: >
  add() in calc.py returns the wrong result and the test for it fails.
  Fix the code so the tests pass. Do not change the tests.
item:
  type: bug
  brief:
    acceptance: ["python3 -m unittest discover -s tests passes"]
    constraints: ["do not change the existing tests"]
profile:
  harness: claude-code
  model: claude-haiku-5-5
  role: Implementer
sandbox: any
operator:
  decisions: approve_once
graders:
  required:
    - outcome.hidden_tests: { command: "python3 -m unittest hidden.test_add" }
    - outcome.run_state: succeeded
    - outcome.files: { only: [calc.py] }
    - governance.no_violation
  report:
    - process.tokens
    - process.asks
limits: { wall_s: 600, tokens: 150000 }
