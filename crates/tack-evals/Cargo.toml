[package]
name = "tack-evals"
description = "Development harness: runs a task through Tack in a throwaway world and records what it left; never released"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[[bin]]
name = "tack-evals"
path = "src/main.rs"

[lib]
name = "tack_evals"
path = "src/lib.rs"

[dependencies]
# `poll_until_sync` is the one wait loop every spawned-server test already uses; the fake agent
# the harness's own tests drive lives there too.
tack-test-support = { path = "../tack-test-support" }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Every world and every exam directory is a guard that deletes itself, a `--keep-worlds` run excepted.
tempfile = { workspace = true }
# Blocking on purpose: the harness is one operator talking to one server, in sequence.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# One integration-test binary: every file under tests/ is a module of tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"
