[package]
name = "tack-cli"
description = "CLI companion for Tack"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tack"
path = "src/main.rs"

[lib]
name = "tack_cli"
path = "src/lib.rs"

[features]
# Embed the pre-built SPA into the single `tack` binary for distribution.
# Forwards to tack-api's embed-spa feature (requires frontend/dist/ at build time).
embed-spa = ["tack-api/embed-spa"]

[dependencies]
# The server runs in-process via `tack serve` (and bare `tack`), so the single
# `tack` binary is both the app and the CLI client.
tack-api = { path = "../tack-api" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
# HTTP client — blocking API keeps CLI code simple; rustls-tls avoids OpenSSL dep
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
# Shell completion generation — maintained by clap team, ~50 KB compiled
clap_complete = "4"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
# Card III-E6's cross-surface CLI E2E test (`tests/e6_scheduler_e2e_test.rs`)
# spawns a real `tack serve` subprocess and speaks the runner-v1 protocol
# directly (the CLI itself has no runner-protocol commands — see that
# file's module doc); `chrono` builds capability-report timestamps for
# those direct HTTP calls. Already a workspace dependency (tack-api,
# tack-db, ...); not newly introduced to the lockfile.
chrono = { workspace = true }
# Test-only: proves execution.rs's request-body builders deserialize into
# the real nested snapshot types (`AgentProfileSnapshot`, `RepositorySnapshot`,
# `PermissionPolicy`) the operator API validates against, one level deeper
# than `tack-api`'s own `CreateExecution` struct. Not a production dependency.
tack-orch = { path = "../tack-orch" }
