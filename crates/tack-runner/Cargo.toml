[package]
name = "tack-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
# III-H1: the runner's own HTTP transport. Reused from the workspace table
# (already used by tack-api/tack-orch/tack-cli), not a new version pin.
reqwest = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tack-orch = { path = "../tack-orch" }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-util` (paused/auto-advancing virtual time) is not part of the
# `full` feature bundle `[dependencies]` pulls in, and is only ever needed
# by tests.
tokio = { workspace = true, features = ["test-util"] }
