[package]
name = "tack-orch"
description = "The pure runner-v1 scheduling domain for Tack — runner selection and batching, and per-request model policy."
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure on purpose: no store, no SQL, no clock. Dependency direction is INWARD ONLY:
# tack-orch may depend on tack-core and tack-protocol, never on tack-db or tack-api.
# `scripts/check-crate-graph.sh` keeps it that way.
[dependencies]
tack-protocol = { path = "../tack-protocol" }
chrono = { workspace = true }

[lints]
workspace = true
