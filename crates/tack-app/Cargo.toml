[package]
name = "tack-app"
description = "Tack's use cases and background ticks: the rules of a run, over the store and a clock"
version.workspace = true
edition.workspace = true
license.workspace = true

# No axum and no sqlx, on purpose: this crate is the application layer. HTTP types belong to
# tack-api and SQL to tack-db; `scripts/check-crate-graph.sh` and `make deny` keep both out.
[dependencies]
tack-protocol = { path = "../tack-protocol" }
tack-core = { path = "../tack-core" }
tack-orch = { path = "../tack-orch" }
tack-db = { path = "../tack-db" }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# The ticks that talk to GitHub and the backup store need an HTTP client.
reqwest = { workspace = true }

[dev-dependencies]
tack-test-support = { path = "../tack-test-support" }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
