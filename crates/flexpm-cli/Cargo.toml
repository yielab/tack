[package]
name = "flexpm-cli"
description = "CLI companion for FlexPM"
version.workspace = true
edition.workspace = true

[lib]
name = "flexpm_cli"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
# HTTP client — blocking API keeps CLI code simple; rustls-tls avoids OpenSSL dep
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
# Shell completion generation — maintained by clap team, ~50 KB compiled
clap_complete = "4"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }
