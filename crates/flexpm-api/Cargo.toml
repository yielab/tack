[package]
name = "flexpm-api"
description = "HTTP API server for FlexPM"
version.workspace = true
edition.workspace = true

[features]
# Embed the pre-built SPA into the binary for single-binary distribution.
# Requires `frontend/dist/` to exist at compile time (`npm run build`).
embed-spa = ["dep:rust-embed"]

[dependencies]
# Optional: embed frontend/dist/ into the binary at compile time
rust-embed = { version = "8", optional = true }
flexpm-core = { path = "../flexpm-core" }
flexpm-db = { path = "../flexpm-db" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
validator = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
