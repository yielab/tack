[package]
name = "tack-api"
autotests = false
description = "HTTP API server for Tack"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Embed the pre-built SPA into the binary for single-binary distribution.
# Requires `frontend/dist/` to exist at compile time (`npm run build`).
embed-spa = ["dep:rust-embed"]

[dependencies]
tack-protocol = { path = "../tack-protocol", features = ["openapi"] }
# Optional: embed frontend/dist/ into the binary at compile time
rust-embed = { version = "8", optional = true }
tack-core = { path = "../tack-core", features = ["openapi"] }
tack-db = { path = "../tack-db" }
# The runner-v1 execution domain: scheduler/retention/observability task
# spawn in execution_runtime.rs, and the request/attempt types the execution
# and runner-protocol handlers build on.
# The use cases the handlers call; `From<AppError> for ApiError` lives in error.rs.
tack-app = { path = "../tack-app" }
async-trait = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
validator = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
tack-test-support = { path = "../tack-test-support" }
# Mock GitHub's HTTP API in github_sync push tests
wiremock = "0.6"
tempfile = { workspace = true }

[lints]
workspace = true

# One integration-test binary: every file under tests/ is a module of tests/it.rs, so the
# dependency graph is linked once instead of once per file.
[[test]]
name = "it"
path = "tests/it.rs"
